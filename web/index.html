      <h1>Canon: the shared memory of a company, for its people and its AI agents</h1>
      <p>Canon keeps one record of decisions, each backed by a quote checked word for word against its source, knows who has the authority to change a rule, and flags drift: a message that breaks a decision, an out-of-date document, or an AI agent about to act against the record. Demo company: Northwind Labs (made up).</p>
      <p>Built for the Google Cloud AI Builder Cup 2026 on Gemini (Vertex AI), Firestore, Cloud Run and Firebase Hosting. A plain-text brief for AI readers, with links, a two-minute test path and curl commands, is at <a href="/llms.txt">/llms.txt</a>.</p>
