# Merge to main = deploy. API to Cloud Run, web to Firebase Hosting (canon-tn07),
# which canon.tn07.dev fronts via deploy/edge (deployed by hand with wrangler).
# ponytail: no staging; traffic goes straight to 100%. Hackathon prototype.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "mocks/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: teejayproject   # explicit: gcloud would otherwise guess "developer"
  REGION: asia-south1
  PUBLIC_URL: https://canon.tn07.dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Backend tests (fake LLM, memory store, no network)
        working-directory: backend
        env: { CANON_FAKE_LLM: "1", CANON_MEMORY_STORE: "1" }
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Web build
        run: if [ -d web ]; then cd web && npm ci && npm run build; fi

  api:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy API
        run: |
          gcloud run deploy canon --source backend --project "$PROJECT" --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT/canon/api:$GITHUB_SHA" \
            --service-account canon-run@teejayproject.iam.gserviceaccount.com \
            --allow-unauthenticated --min-instances=0 --max-instances=3 \
            --cpu=1 --memory=1Gi --timeout=300 --concurrency=40 \
            --labels=app=canon \
            --set-secrets="CANON_CONFIG=canon-config:latest" \
            --set-env-vars="CANON_PUBLIC_URL=$PUBLIC_URL,GOOGLE_CLOUD_PROJECT=$PROJECT,CANON_BASE_WS=acme2" \
            --quiet
      - name: Smoke test
        run: curl -fsS "https://canon-974343814740.asia-south1.run.app/health"

  web:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Build and deploy hosting
        run: |
          if [ ! -d web ]; then echo "no web/ yet"; exit 0; fi
          (cd web && npm ci && npm run build)
          npx -y firebase-tools@latest deploy --only hosting --project "$PROJECT" --non-interactive
      - name: Smoke test
        run: if [ -d web ]; then curl -fsS "https://canon-tn07.web.app/health"; fi
