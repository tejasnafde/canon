[project]
name = "canon"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "google-adk",
    "google-cloud-firestore",
    "google-genai",
    "httpx",
    "mcp",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
